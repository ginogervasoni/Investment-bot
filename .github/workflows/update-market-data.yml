name: Update Santa Fe market data

on:
  schedule:
    - cron: "17 8 1 * *"
      timezone: "America/Argentina/Cordoba"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-santa-fe-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve previous dataset
        run: cp data/market-santa-fe.json /tmp/market-santa-fe-previous.json

      - name: Download latest authorized aggregates
        run: python scripts/extract_tulugar_market.py

      - name: Validate periods, totals and territorial matches
        run: python scripts/validate_market_data.py --previous /tmp/market-santa-fe-previous.json

      - name: Detect real changes
        id: changes
        run: |
          if git diff --quiet -- data/market-santa-fe.json data/source-catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated market data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-santa-fe.json data/source-catalog.json
          git commit -m "Update Santa Fe market data"
          git push
